desc: |
  The International Linguistics Olympiad (IOL) is the premier international competition in linguistics for secondary school students. It has been held annually since 2003, bringing together some of the best young linguists from around the world. Problems at IOL cover a wide variety of languages and linguistic topics, ranging from phonology and morphology to syntax, semantics, and writing systems. No prior knowledge of linguistics or languages other than English is required — all necessary context is provided in each problem.